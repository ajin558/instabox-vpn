# Clash Verge / Mihomo 本地配置模板
# 不要直接用这个文件：先用 generate.py 把占位符换成真实值再导入。
# 需要 Mihomo 内核，原版 Clash 不支持 VLESS；XHTTP 需要 Mihomo >= v1.19.22，推荐 v1.19.33。
# 2026-11-04 更新：分流 + fallback
#   - 国内域名/IP、局域网/私有地址直接走 DIRECT，不再绕海外节点
#   - PROXY 组改为 fallback：优先 xhttp，xhttp 彻底失败时才自动切 ws，组里不再放 DIRECT
#   - 模式必须是规则（rule），全局模式会绕过下面这些规则
#   - 首次导入时 Clash Verge 可能要下载 GEOIP/GEOSITE 数据库，等下载完成再测

mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: false

# 客户端 DNS：用 DoH 解析，避免本地 DNS 对 instabox.tech 解析异常
# 注意：不要加 fallback，否则可能触发 GeoIP 下载
dns:
  enable: true
  ipv6: false
  default-nameserver:
    - 223.5.5.5
    - 8.8.8.8
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://dns.google/dns-query

proxies:
  - name: instabox-muse-xhttp
    type: vless
    server: __XHTTP_HOST__
    port: 443
    uuid: __UUID__
    udp: true
    tls: true
    servername: __XHTTP_HOST__
    client-fingerprint: chrome
    alpn:
      - h2
      - http/1.1
    network: xhttp
    xhttp-opts:
      path: /xhttp
      host: __XHTTP_HOST__
      mode: packet-up
    skip-cert-verify: false

  - name: instabox-muse-ws
    type: vless
    server: __WS_HOST__
    port: 443
    uuid: __UUID__
    udp: true
    tls: true
    servername: __WS_HOST__
    client-fingerprint: chrome
    network: ws
    ws-opts:
      path: /ws
      headers:
        Host: __WS_HOST__
    skip-cert-verify: false

proxy-groups:
  - name: PROXY
    type: fallback
    proxies:
      - instabox-muse-xhttp
      - instabox-muse-ws
    url: https://www.gstatic.com/generate_204
    interval: 300

rules:
  - GEOSITE,private,DIRECT
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,127.0.0.0/8,DIRECT,no-resolve
  - GEOSITE,cn,DIRECT
  - GEOIP,CN,DIRECT,no-resolve
  - MATCH,PROXY
